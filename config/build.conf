# govechoOS — конфигурация сборки
DISTRO_NAME="govechoOS"
DISTRO_VERSION="$(cat "$(dirname "$BASH_SOURCE")/../VERSION" 2>/dev/null || echo 1.0.0)"

# Целевая архитектура
ARCH="x86_64"
QEMU_ARCH="x86_64"
CROSS_COMPILE=""            # пусто = нативная сборка

# Размер корневого образа (МБ) и inode-плотность
ROOTFS_SIZE_MB=256
INODE_RATIO=4096            # 1 inode на 4 КБ — для мелких файлов

# Зеркала LFS (используются только в полном режиме build_mode=full)
LFS_MIRROR="https://tux.rainside-lfs.linuxfromscratch.org"
BUSYBOX_URL="https://busybox.net/downloads/busybox-1.37.0.tar.bz2"

# Режим сборки: minimal (busybox с хоста/локальный) | full (LFS из исходников)
BUILD_MODE="minimal"

# Ядро для QEMU-запуска
KERNEL_PATH="/boot/vmlinuz"
